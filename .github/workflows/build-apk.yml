name: Build TaishanRU APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleRelease --stacktrace
      - run: mkdir -p out && cp app/build/outputs/apk/release/app-release.apk out/TaishanRU.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TaishanRU-apk
          path: out/TaishanRU.apk
          if-no-files-found: error
